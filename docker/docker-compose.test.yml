services:
  postgres-test:
    image: postgres:16-alpine
    container_name: cl-postgres-test
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: corporate_lawyers_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: cl-redis-test
    ports:
      - '6380:6379'
    tmpfs:
      - /data
